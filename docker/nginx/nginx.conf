# Nginx 反向代理配置
# 适用场景：纯 Docker 管理，nginx 作为唯一对外入口
# 前端 (zhuangxiu-web:3000) 和后端 (zhuangxiu-server:9096) 均不对外暴露端口
# 所有流量经由 nginx 的 80 端口进入，由 location 规则分发

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # 开启 gzip 压缩，减少传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 上传文件大小限制
    client_max_body_size 50m;

    server {
        listen 80 default_server;
        # 默认 Web 入口；API 域名由下面独立的 server 精确匹配。
        server_name _;

        # /api/* 转发给后端 Spring Boot（容器内网 zhuangxiu-server:9096）
        location /api/ {
            proxy_pass http://zhuangxiu-server:9096;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # 其余所有请求转发给前端 Next.js（SSR/CSR 统一由 web 容器处理）
        location / {
            proxy_pass http://zhuangxiu-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 支持 WebSocket（如有 SSE / 实时能力时）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 小程序独立 API 入口：部署时将 api.example.com 替换为真实域名。
    # 正式调用需启用 HTTPS，证书与 443 映射步骤见后端独立域名配置文档。
    server {
        listen 80;
        server_name api.example.com;

        location / {
            # 同一 Docker 网络中直接访问后端；保留原 /api/... 请求路径。
            proxy_pass http://zhuangxiu-server:9096;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
